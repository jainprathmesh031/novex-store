<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NOVEX Admin Panel</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background: #07070b;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            padding: 30px 16px;

        }


        .container {

            width: 100%;

            max-width: 1100px;

            margin: auto;

        }


        /* =========================
           LOGIN
        ========================= */

        .login-card {

            width: 100%;

            max-width: 430px;

            margin: 100px auto;

            padding: 35px;

            background: #111118;

            border: 1px solid #292936;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.45);

        }


        .logo {

            font-size: 34px;

            font-weight: 900;

            letter-spacing: 5px;

            margin-bottom: 8px;

        }


        .subtitle {

            color: #9999a8;

            font-size: 14px;

            margin-bottom: 28px;

        }


        .input {

            width: 100%;

            padding: 15px;

            border-radius: 10px;

            border: 1px solid #30303c;

            background: #09090e;

            color: white;

            font-size: 15px;

            outline: none;

        }


        .input:focus {

            border-color: #7777ff;

        }


        .login-button {

            width: 100%;

            margin-top: 15px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: white;

            color: black;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

        }


        .login-button:hover {

            opacity: .88;

        }


        .login-button:disabled {

            opacity: .5;

            cursor: wait;

        }


        .error {

            display: none;

            margin-top: 15px;

            color: #ff7070;

            font-size: 14px;

            line-height: 1.5;

        }


        /* =========================
           DASHBOARD
        ========================= */

        .dashboard {

            display: none;

        }


        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 25px;

        }


        .title {

            font-size: 30px;

            font-weight: 900;

        }


        .top-buttons {

            display: flex;

            gap: 10px;

        }


        button {

            cursor: pointer;

        }


        .refresh-button,
        .logout-button {

            padding: 12px 18px;

            border-radius: 10px;

            border: none;

            font-weight: 800;

        }


        .refresh-button {

            background: white;

            color: black;

        }


        .logout-button {

            background: #24242e;

            color: white;

        }


        /* =========================
           STATS
        ========================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 25px;

        }


        .stat {

            padding: 22px;

            background: #111118;

            border: 1px solid #292936;

            border-radius: 15px;

        }


        .stat-label {

            color: #9999a8;

            font-size: 13px;

        }


        .stat-number {

            font-size: 32px;

            font-weight: 900;

            margin-top: 8px;

        }


        /* =========================
           ORDERS
        ========================= */

        .orders {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .order {

            padding: 20px;

            background: #111118;

            border: 1px solid #292936;

            border-radius: 15px;

        }


        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 16px;

        }


        .order-id {

            font-size: 17px;

            font-weight: 900;

        }


        .status {

            padding: 7px 12px;

            border-radius: 999px;

            font-size: 12px;

            font-weight: 900;

        }


        .pending {

            background: #3b3000;

            color: #ffd43b;

        }


        .approved {

            background: #06351d;

            color: #55e38b;

        }


        .rejected {

            background: #3c0b0b;

            color: #ff7777;

        }


        .details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

        }


        .detail {

            padding: 13px;

            background: #0b0b10;

            border-radius: 10px;

            color: #ddddE5;

            word-break: break-word;

        }


        .detail-label {

            display: block;

            color: #888896;

            font-size: 11px;

            text-transform: uppercase;

            margin-bottom: 5px;

        }


        .actions {

            display: flex;

            gap: 10px;

            margin-top: 18px;

        }


        .approve-button,
        .reject-button {

            padding: 12px 18px;

            border: none;

            border-radius: 9px;

            font-weight: 800;

        }


        .approve-button {

            background: #1d9c58;

            color: white;

        }


        .reject-button {

            background: #b83333;

            color: white;

        }


        .empty,
        .loading {

            padding: 50px 20px;

            text-align: center;

            color: #888896;

            background: #111118;

            border: 1px solid #292936;

            border-radius: 15px;

        }


        @media (max-width: 700px) {

            .stats {

                grid-template-columns: 1fr;

            }


            .details {

                grid-template-columns: 1fr;

            }


            .actions {

                flex-direction: column;

            }


            .approve-button,
            .reject-button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==================================
         LOGIN SCREEN
    =================================== -->

    <div
        class="login-card"
        id="loginCard">


        <div class="logo">
            NOVEX
        </div>


        <div class="subtitle">
            Store Administration
        </div>


        <input
            class="input"
            id="passwordInput"
            type="password"
            placeholder="Enter admin password"
            autocomplete="current-password">


        <button
            class="login-button"
            id="loginButton">

            Login

        </button>


        <div
            class="error"
            id="loginError">

        </div>


    </div>



    <!-- ==================================
         ADMIN DASHBOARD
    =================================== -->

    <div
        class="dashboard"
        id="dashboard">


        <div class="topbar">


            <div>

                <div class="title">
                    NOVEX Admin
                </div>

                <div class="subtitle">
                    Store Order Management
                </div>

            </div>


            <div class="top-buttons">


                <button
                    class="refresh-button"
                    id="refreshButton">

                    ↻ Refresh

                </button>


                <button
                    class="logout-button"
                    id="logoutButton">

                    Logout

                </button>


            </div>


        </div>



        <!-- ==================================
             STATISTICS
        =================================== -->

        <div class="stats">


            <div class="stat">

                <div class="stat-label">
                    Total Orders
                </div>

                <div
                    class="stat-number"
                    id="totalOrders">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Pending Orders
                </div>

                <div
                    class="stat-number"
                    id="pendingOrders">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Approved Orders
                </div>

                <div
                    class="stat-number"
                    id="approvedOrders">

                    0

                </div>

            </div>


        </div>



        <!-- ==================================
             ORDERS
        =================================== -->

        <div
            class="orders"
            id="orders">

            <div class="loading">
                Loading orders...
            </div>

        </div>


    </div>


</div>



<script>


/* =========================================
   CONFIGURATION
========================================= */


const API_URL =
    "https://novex-store-api.jainprathmesh031.workers.dev";


/* =========================================
   ADMIN PASSWORD
========================================= */


let adminPassword = "";


/* =========================================
   ELEMENTS
========================================= */


const loginCard =
    document.getElementById(
        "loginCard"
    );


const dashboard =
    document.getElementById(
        "dashboard"
    );


const passwordInput =
    document.getElementById(
        "passwordInput"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const refreshButton =
    document.getElementById(
        "refreshButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const ordersContainer =
    document.getElementById(
        "orders"
    );


/* =========================================
   LOGIN BUTTON
========================================= */


loginButton.addEventListener(
    "click",
    login
);


/* =========================================
   ENTER KEY LOGIN
========================================= */


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


/* =========================================
   LOGIN
========================================= */


async function login() {


    const password =
        passwordInput.value;


    if (!password) {

        showLoginError(
            "Please enter your admin password."
        );

        return;

    }


    adminPassword =
        password;


    loginButton.disabled =
        true;


    loginButton.textContent =
        "Checking...";


    hideLoginError();


    const success =
        await loadOrders();


    loginButton.disabled =
        false;


    loginButton.textContent =
        "Login";


    if (success) {


        loginCard.style.display =
            "none";


        dashboard.style.display =
            "block";


    } else {


        adminPassword =
            "";


    }

}


/* =========================================
   LOAD ORDERS
========================================= */


async function loadOrders() {


    console.log(
        "================================"
    );


    console.log(
        "NOVEX ADMIN: Loading orders"
    );


    console.log(
        "Password present:",
        adminPassword.length > 0
    );


    console.log(
        "API:",
        API_URL
    );


    try {


        const response =
            await fetch(
                API_URL +
                "/api/admin/orders",
                {

                    method: "GET",

                    cache: "no-store",

                    headers: {

                        "X-Admin-Password":
                            adminPassword,

                        "Accept":
                            "application/json"

                    }

                }
            );


        console.log(
            "HTTP status:",
            response.status
        );


        const responseText =
            await response.text();


        console.log(
            "API response:",
            responseText
        );


        let data;


        try {

            data =
                JSON.parse(
                    responseText
                );

        } catch (jsonError) {


            showLoginError(
                "The API returned an invalid response. Check the browser Console."
            );


            console.error(
                "JSON ERROR:",
                jsonError
            );


            return false;

        }


        /* =============================
           SUCCESS
        ============================= */


        if (
            response.ok &&
            data.success
        ) {


            console.log(
                "ADMIN LOGIN SUCCESS"
            );


            displayOrders(
                Array.isArray(
                    data.orders
                )
                    ? data.orders
                    : []
            );


            return true;

        }


        /* =============================
           UNAUTHORIZED
        ============================= */


        if (
            response.status === 401
        ) {


            showLoginError(
                "Password rejected by the Worker. Check that ADMIN_PASSWORD is the exact secret used by this Worker."
            );


            console.error(
                "Worker returned 401 Unauthorized."
            );


            return false;

        }


        /* =============================
           OTHER API ERROR
        ============================= */


        showLoginError(
            "API error (" +
            response.status +
            "): " +
            (
                data.error ||
                "Unknown error."
            )
        );


        console.error(
            "API ERROR:",
            data
        );


        return false;


    } catch (error) {


        console.error(
            "FETCH ERROR:",
            error
        );


        showLoginError(
            "Could not connect to the NOVEX API. Check the browser Console."
        );


        return false;

    }

}


/* =========================================
   DISPLAY ORDERS
========================================= */


function displayOrders(
    orders
) {


    const total =
        orders.length;


    const pending =
        orders.filter(
            function(order) {

                return String(
                    order.status
                ).toUpperCase()
                === "PENDING";

            }
        ).length;


    const approved =
        orders.filter(
            function(order) {

                return String(
                    order.status
                ).toUpperCase()
                === "APPROVED";

            }
        ).length;


    document
        .getElementById(
            "totalOrders"
        )
        .textContent =
            total;


    document
        .getElementById(
            "pendingOrders"
        )
        .textContent =
            pending;


    document
        .getElementById(
            "approvedOrders"
        )
        .textContent =
            approved;


    if (
        orders.length === 0
    ) {


        ordersContainer.innerHTML = `

            <div class="empty">

                No orders found.

            </div>

        `;


        return;

    }


    ordersContainer.innerHTML =
        orders
            .map(
                createOrderHTML
            )
            .join("");


}


/* =========================================
   CREATE ORDER HTML
========================================= */


function createOrderHTML(
    order
) {


    const status =
        String(
            order.status ||
            "PENDING"
        ).toUpperCase();


    let statusClass =
        "pending";


    if (
        status === "APPROVED"
    ) {

        statusClass =
            "approved";

    }


    if (
        status === "REJECTED"
    ) {

        statusClass =
            "rejected";

    }


    let actions =
        "";


    if (
        status === "PENDING"
    ) {


        actions = `

            <div class="actions">

                <button
                    class="approve-button"
                    onclick="approveOrder(
                        '${escapeHTML(
                            order.order_id
                        )}'
                    )">

                    ✓ Approve Order

                </button>


                <button
                    class="reject-button"
                    onclick="rejectOrder(
                        '${escapeHTML(
                            order.order_id
                        )}'
                    )">

                    ✕ Reject Order

                </button>

            </div>

        `;

    }


    return `

        <div class="order">


            <div class="order-header">

                <div class="order-id">

                    ${escapeHTML(
                        order.order_id ||
                        "Unknown Order"
                    )}

                </div>


                <div
                    class="status ${statusClass}">

                    ${escapeHTML(
                        status
                    )}

                </div>

            </div>



            <div class="details">


                <div class="detail">

                    <span class="detail-label">
                        Minecraft IGN
                    </span>

                    ${escapeHTML(
                        order.minecraft_ign ||
                        order.ign ||
                        "-"
                    )}

                </div>


                <div class="detail">

                    <span class="detail-label">
                        Rank
                    </span>

                    ${escapeHTML(
                        order.rank ||
                        "-"
                    )}

                </div>


                <div class="detail">

                    <span class="detail-label">
                        Amount
                    </span>

                    ₹${escapeHTML(
                        String(
                            order.amount ??
                            order.price ??
                            "-"
                        )
                    )}

                </div>


                <div class="detail">

                    <span class="detail-label">
                        UTR / Transaction ID
                    </span>

                    ${escapeHTML(
                        order.utr ||
                        order.transaction_id ||
                        "-"
                    )}

                </div>


                <div class="detail">

                    <span class="detail-label">
                        Created
                    </span>

                    ${escapeHTML(
                        order.created_at ||
                        "-"
                    )}

                </div>


            </div>


            ${actions}


        </div>

    `;

}


/* =========================================
   APPROVE ORDER
========================================= */


async function approveOrder(
    orderId
) {


    const confirmed =
        confirm(
            "Are you sure you want to APPROVE this order?"
        );


    if (!confirmed) {

        return;

    }


    await updateOrder(
        "/api/admin/approve",
        orderId
    );

}


/* =========================================
   REJECT ORDER
========================================= */


async function rejectOrder(
    orderId
) {


    const confirmed =
        confirm(
            "Are you sure you want to REJECT this order?"
        );


    if (!confirmed) {

        return;

    }


    await updateOrder(
        "/api/admin/reject",
        orderId
    );

}


/* =========================================
   UPDATE ORDER
========================================= */


async function updateOrder(
    endpoint,
    orderId
) {


    try {


        console.log(
            "Updating order:",
            orderId
        );


        const response =
            await fetch(
                API_URL +
                endpoint,
                {

                    method: "POST",

                    cache: "no-store",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Admin-Password":
                            adminPassword,

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            order_id:
                                orderId

                        })

                }
            );


        const text =
            await response.text();


        console.log(
            "Update response:",
            response.status,
            text
        );


        let data;


        try {

            data =
                JSON.parse(text);

        } catch (error) {

            alert(
                "Server returned an invalid response."
            );

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {


            alert(
                data.error ||
                "Could not update order."
            );


            return;

        }


        alert(
            data.message ||
            "Order updated successfully."
        );


        await loadOrders();


    } catch (error) {


        console.error(
            "UPDATE ERROR:",
            error
        );


        alert(
            "Could not connect to the NOVEX API."
        );

    }

}


/* =========================================
   REFRESH
========================================= */


refreshButton.addEventListener(
    "click",
    async function() {

        refreshButton.disabled =
            true;


        refreshButton.textContent =
            "Loading...";


        await loadOrders();


        refreshButton.disabled =
            false;


        refreshButton.textContent =
            "↻ Refresh";

    }
);


/* =========================================
   LOGOUT
========================================= */


logoutButton.addEventListener(
    "click",
    function() {


        adminPassword =
            "";


        dashboard.style.display =
            "none";


        loginCard.style.display =
            "block";


        passwordInput.value =
            "";


        hideLoginError();


        passwordInput.focus();

    }
);


/* =========================================
   LOGIN ERROR
========================================= */


function showLoginError(
    message
) {


    loginError.textContent =
        message;


    loginError.style.display =
        "block";

}


/* =========================================
   HIDE LOGIN ERROR
========================================= */


function hideLoginError() {


    loginError.textContent =
        "";


    loginError.style.display =
        "none";

}


/* =========================================
   HTML SECURITY
========================================= */


function escapeHTML(
    value
) {


    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   STARTUP
========================================= */


console.log(
    "NOVEX ADMIN PANEL LOADED"
);


console.log(
    "API URL:",
    API_URL
);


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NOVEX Admin Panel</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #07070b;

            color: #ffffff;

            padding: 30px 16px;

        }


        .container {

            width: 100%;

            max-width: 1100px;

            margin: auto;

        }


        .login-card,
        .dashboard {

            background:
                #111118;

            border:
                1px solid #292936;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.45);

        }


        .login-card {

            max-width: 450px;

            margin:
                100px auto;

            text-align: center;

        }


        .logo {

            font-size: 32px;

            font-weight: 900;

            letter-spacing: 4px;

            margin-bottom: 8px;

        }


        .subtitle {

            color: #9999a8;

            margin-bottom: 30px;

        }


        input {

            width: 100%;

            padding: 14px 16px;

            background: #09090e;

            border:
                1px solid #30303c;

            color: white;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

        }


        input:focus {

            border-color: #7777ff;

        }


        button {

            border: 0;

            border-radius: 10px;

            padding: 13px 20px;

            font-weight: 700;

            cursor: pointer;

        }


        .login-button {

            width: 100%;

            margin-top: 15px;

            background: #ffffff;

            color: #000000;

        }


        .login-button:hover {

            opacity: .88;

        }


        .error {

            color: #ff6b6b;

            margin-top: 15px;

            display: none;

        }


        .dashboard {

            display: none;

        }


        .topbar {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 25px;

            flex-wrap: wrap;

        }


        .title {

            font-size: 28px;

            font-weight: 800;

        }


        .logout {

            background: #22222c;

            color: white;

        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 25px;

        }


        .stat {

            background: #0b0b10;

            border:
                1px solid #292936;

            border-radius: 14px;

            padding: 20px;

        }


        .stat-label {

            color: #9999a8;

            font-size: 13px;

        }


        .stat-number {

            font-size: 30px;

            font-weight: 800;

            margin-top: 8px;

        }


        .orders {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .order {

            background: #0b0b10;

            border:
                1px solid #292936;

            border-radius: 14px;

            padding: 20px;

        }


        .order-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 15px;

        }


        .order-id {

            font-weight: 800;

            font-size: 17px;

        }


        .status {

            padding: 6px 10px;

            border-radius: 999px;

            font-size: 12px;

            font-weight: 800;

        }


        .pending {

            background: #332900;

            color: #ffd43b;

        }


        .approved {

            background: #06351d;

            color: #52e08a;

        }


        .rejected {

            background: #3b0b0b;

            color: #ff7777;

        }


        .details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            color: #ccccd6;

        }


        .detail {

            background: #111118;

            padding: 12px;

            border-radius: 9px;

        }


        .detail strong {

            display: block;

            color: #888896;

            font-size: 11px;

            text-transform: uppercase;

            margin-bottom: 5px;

        }


        .actions {

            display: flex;

            gap: 10px;

            margin-top: 18px;

        }


        .approve {

            background: #1c9c58;

            color: white;

        }


        .reject {

            background: #b83333;

            color: white;

        }


        .refresh {

            background: white;

            color: black;

        }


        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #888896;

        }


        .loading {

            text-align: center;

            padding: 40px;

            color: #9999a8;

        }


        @media (max-width: 700px) {

            .stats {

                grid-template-columns: 1fr;

            }


            .details {

                grid-template-columns: 1fr;

            }


            .actions {

                flex-direction: column;

            }


            .actions button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- LOGIN -->

    <div
        class="login-card"
        id="loginCard">

        <div class="logo">
            NOVEX
        </div>

        <div class="subtitle">
            Store Administration
        </div>


        <input
            type="password"
            id="passwordInput"
            placeholder="Admin password">


        <button
            class="login-button"
            id="loginButton">

            Login

        </button>


        <div
            class="error"
            id="loginError">

            Incorrect admin password.

        </div>

    </div>



    <!-- DASHBOARD -->

    <div
        class="dashboard"
        id="dashboard">


        <div class="topbar">

            <div>

                <div class="title">
                    NOVEX Admin
                </div>

                <div class="subtitle">
                    Order Management
                </div>

            </div>


            <div>

                <button
                    class="refresh"
                    onclick="loadOrders()">

                    ↻ Refresh

                </button>


                <button
                    class="logout"
                    onclick="logout()">

                    Logout

                </button>

            </div>

        </div>



        <!-- STATS -->

        <div class="stats">


            <div class="stat">

                <div class="stat-label">
                    Total Orders
                </div>

                <div
                    class="stat-number"
                    id="totalOrders">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Pending
                </div>

                <div
                    class="stat-number"
                    id="pendingOrders">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Approved
                </div>

                <div
                    class="stat-number"
                    id="approvedOrders">

                    0

                </div>

            </div>


        </div>



        <!-- ORDERS -->

        <div
            class="orders"
            id="orders">

            <div class="loading">
                Loading orders...
            </div>

        </div>


    </div>

</div>



<script>


// ==========================================
// CONFIG
// ==========================================

const API_URL =
    "https://novex-store-api.jainprathmesh031.workers.dev";


// ==========================================
// ADMIN PASSWORD
// ==========================================

let adminPassword = "";


// ==========================================
// LOGIN
// ==========================================

document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        login
    );


document
    .getElementById("passwordInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                login();

            }

        }
    );


async function login() {

    const password =
        document
            .getElementById("passwordInput")
            .value
            .trim();


    if (!password) {

        document
            .getElementById("loginError")
            .textContent =
                "Enter your admin password.";

        document
            .getElementById("loginError")
            .style.display =
                "block";

        return;

    }


    adminPassword =
        password;


    const success =
        await loadOrders();


    if (success) {

        document
            .getElementById("loginCard")
            .style.display =
                "none";

        document
            .getElementById("dashboard")
            .style.display =
                "block";

    } else {

        adminPassword = "";

        document
            .getElementById("loginError")
            .textContent =
                "Incorrect admin password.";

        document
            .getElementById("loginError")
            .style.display =
                "block";

    }

}


// ==========================================
// LOAD ORDERS
// ==========================================

async function loadOrders() {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/admin/orders",
                {

                    method: "GET",

                    headers: {

                        "X-Admin-Password":
                            adminPassword

                    }

                }
            );


        const result =
            await response.json();


        console.log(
            "ADMIN ORDERS:",
            result
        );


        if (
            !response.ok ||
            !result.success
        ) {

            return false;

        }


        displayOrders(
            result.orders || []
        );


        return true;


    } catch (error) {

        console.error(
            "ADMIN ERROR:",
            error
        );

        return false;

    }

}


// ==========================================
// DISPLAY ORDERS
// ==========================================

function displayOrders(orders) {


    const ordersContainer =
        document.getElementById(
            "orders"
        );


    const total =
        orders.length;


    const pending =
        orders.filter(
            order =>
                order.status === "PENDING"
        ).length;


    const approved =
        orders.filter(
            order =>
                order.status === "APPROVED"
        ).length;


    document
        .getElementById("totalOrders")
        .textContent =
            total;


    document
        .getElementById("pendingOrders")
        .textContent =
            pending;


    document
        .getElementById("approvedOrders")
        .textContent =
            approved;


    if (!orders.length) {

        ordersContainer.innerHTML = `

            <div class="empty">

                No orders found.

            </div>

        `;

        return;

    }


    ordersContainer.innerHTML =
        orders
            .map(
                order =>
                    createOrderHTML(order)
            )
            .join("");

}


// ==========================================
// CREATE ORDER CARD
// ==========================================

function createOrderHTML(order) {


    const status =
        String(
            order.status || "PENDING"
        ).toLowerCase();


    const buttons =
        order.status === "PENDING"

            ? `

                <div class="actions">

                    <button
                        class="approve"
                        onclick="approveOrder('${order.order_id}')">

                        ✓ Approve

                    </button>

                    <button
                        class="reject"
                        onclick="rejectOrder('${order.order_id}')">

                        ✕ Reject

                    </button>

                </div>

              `

            : "";


    return `

        <div class="order">


            <div class="order-header">

                <div class="order-id">

                    ${escapeHTML(
                        order.order_id
                    )}

                </div>


                <div
                    class="status ${status}">

                    ${escapeHTML(
                        order.status
                    )}

                </div>

            </div>


            <div class="details">


                <div class="detail">

                    <strong>
                        Minecraft IGN
                    </strong>

                    ${escapeHTML(
                        order.minecraft_ign
                    )}

                </div>


                <div class="detail">

                    <strong>
                        Rank
                    </strong>

                    ${escapeHTML(
                        order.rank
                    )}

                </div>


                <div class="detail">

                    <strong>
                        Amount
                    </strong>

                    ₹${escapeHTML(
                        String(order.amount)
                    )}

                </div>


                <div class="detail">

                    <strong>
                        UTR
                    </strong>

                    ${escapeHTML(
                        order.utr
                    )}

                </div>


            </div>


            ${buttons}


        </div>

    `;

}


// ==========================================
// APPROVE
// ==========================================

async function approveOrder(orderId) {

    if (
        !confirm(
            "Approve this order?"
        )
    ) {

        return;

    }


    await updateOrder(
        "/api/admin/approve",
        orderId
    );

}


// ==========================================
// REJECT
// ==========================================

async function rejectOrder(orderId) {

    if (
        !confirm(
            "Reject this order?"
        )
    ) {

        return;

    }


    await updateOrder(
        "/api/admin/reject",
        orderId
    );

}


// ==========================================
// UPDATE ORDER
// ==========================================

async function updateOrder(
    endpoint,
    orderId
) {

    try {

        const response =
            await fetch(
                API_URL + endpoint,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Admin-Password":
                            adminPassword

                    },

                    body: JSON.stringify({

                        order_id:
                            orderId

                    })

                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            alert(
                result.error ||
                "Unable to update order."
            );

            return;

        }


        alert(
            result.message
        );


        await loadOrders();


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to server."
        );

    }

}


// ==========================================
// LOGOUT
// ==========================================

function logout() {

    adminPassword = "";


    document
        .getElementById("dashboard")
        .style.display =
            "none";


    document
        .getElementById("loginCard")
        .style.display =
            "block";


    document
        .getElementById("passwordInput")
        .value =
            "";


}


// ==========================================
// SECURITY
// ==========================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
